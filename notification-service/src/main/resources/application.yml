server:
  port: 8083

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:admin}:${MONGO_INITDB_ROOT_PASSWORD:admin123}@localhost:27017/notifications_db?authSource=admin
  kafka:
    bootstrap-servers: localhost:9092

orderflow:
  kafka:
    topic: order-events
    group-id: notification-group

logging:
  level:
    com.orderflow.notification: INFO
